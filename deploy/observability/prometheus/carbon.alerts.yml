# Carbon-API Prometheus alert rules.
#
# Extracted from DEPLOY.md (round 6). Covers the failure modes that have
# actually paged us. Assumes the `carbon_*` metrics from `/metrics` are
# being scraped every 15s. Uses the recording rules from carbon.rules.yml
# where they exist so the alert evaluator does not re-run heavy queries.
groups:
  - name: carbon-api.alerts
    rules:
      - alert: CarbonApi5xxSurge
        expr: job:carbon_http_5xx_rate5m > 0.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "carbon-api 5xx > 0.5/s for 5m"
          runbook: "https://carbon.dev/runbooks/api-5xx"

      - alert: CarbonApiP99Slow
        # NOTE: `_ms_bucket` — API emits latency in milliseconds. Threshold
        # here is 2000ms (2s) to match the DEPLOY.md prose.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(carbon_http_request_duration_ms_bucket[10m]))
          ) > 2000
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "carbon-api p99 latency > 2s for 10m"

      - alert: CarbonIngestQueueBacklog
        expr: carbon_ingest_queue_depth > 100
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "ingest queue depth > 100 for 15m — workers may be stuck"

      - alert: CarbonIngestSuccessRateLow
        expr: job:carbon_ingest_success_rate5m < 0.9
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "ingest success rate < 90% for 15m"

      - alert: CarbonEventLoopSaturated
        expr: carbon_nodejs_eventloop_lag_ms > 100
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "carbon-api event-loop lag > 100ms for 5m"

      - alert: CarbonAiJudgeBelowThresholdSurge
        expr: job:carbon_ai_judge_below_threshold_rate5m > 0.2
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "AI judge is failing >0.2 verdicts/s below threshold — model or prompts regressed"
