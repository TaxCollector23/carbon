# Prometheus config used by the local docker-compose observability stack.
# Scrapes carbon-api running on the host at :4000 (any OS: docker-compose
# adds host.docker.internal → host-gateway for Linux parity).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: carbon-local
    env: dev

rule_files:
  - /etc/prometheus/carbon.rules.yml
  - /etc/prometheus/carbon.alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: carbon-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: carbon-api

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
