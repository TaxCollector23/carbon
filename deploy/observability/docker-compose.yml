# One-command observability stack for local Carbon development.
#
#   docker compose -f deploy/observability/docker-compose.yml up -d
#
# Brings up Prometheus, Grafana, Tempo, and Alertmanager pre-wired to a
# carbon-api running on the host at :4000. To ship spans, run the API with:
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 pnpm --filter carbon-api dev
#
# Ports:
#   9090 prometheus  |  3002 grafana  |  3200 tempo (query)
#   4317 otlp/grpc   |  4318 otlp/http |  9093 alertmanager

networks:
  carbon-obs:
    driver: bridge

volumes:
  prometheus-data: {}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: carbon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/carbon.rules.yml:/etc/prometheus/carbon.rules.yml:ro
      - ./prometheus/carbon.alerts.yml:/etc/prometheus/carbon.alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets `host.docker.internal` resolve on Linux hosts too (Docker
      # Desktop already provides this on macOS/Windows).
      - "host.docker.internal:host-gateway"
    networks:
      - carbon-obs
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: carbon-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    networks:
      - carbon-obs
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: carbon-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"   # tempo query
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - carbon-obs

  alertmanager:
    image: prom/alertmanager:latest
    container_name: carbon-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - carbon-obs
