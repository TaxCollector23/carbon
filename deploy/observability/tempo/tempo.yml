# Minimal single-tenant Tempo config for local development.
# In-memory ("local" backend on tmpfs-style path), OTLP gRPC + HTTP receivers,
# query API on :3200. Data is discarded on container restart.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: carbon-local
  storage:
    path: /tmp/tempo/generator/wal

usage_report:
  reporting_enabled: false
