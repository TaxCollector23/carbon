# Carbon — Render Blueprint (FREE TIER)
# ─────────────────────────────────────────────────────────────────────────────
# Zero-cost backend deploy. One service. External free managed data.
#
# Trade-offs you should know:
#   1. Render's free web service SPINS DOWN after 15 minutes of inactivity.
#      The next request wakes it up in ~30–60s. Fine for demos, painful for
#      a live production API. Upgrade to `plan: starter` ($7/mo) to keep warm.
#   2. Free web services have NO persistent disk. STORAGE_ROOT lives on
#      ephemeral disk — snapshots and recordings survive restarts as long as
#      the same container is warm, but a redeploy wipes them. For durable
#      artifacts, wire an S3-compatible store (Cloudflare R2 has a real
#      free tier — 10 GB).
#   3. Workers run in-process (EMBED_WORKERS=true) so we don't need a second
#      service. Perfectly fine for early volume.
#
# What you set up outside Render:
#   · Postgres → Neon (neon.tech) — 0.5 GB free forever, no card required
#   · Redis    → Upstash (upstash.com) — 256 MB, 500k commands/mo free
#
# Deploy steps:
#   1. Create a Neon project → copy the pooled connection string.
#   2. Create an Upstash Redis DB → copy the TLS URL (redis://…rediss…).
#   3. Push this repo to GitHub.
#   4. Render → New → Blueprint → point at your repo.
#   5. Render prompts for DATABASE_URL, REDIS_URL, CARBON_AI_API_KEY,
#      ALLOWED_ORIGINS — paste them.
#   6. Wait ~5 min for build. Migrations run automatically pre-deploy.
#   7. Open the carbon-api shell → `pnpm --filter @carbon/api bootstrap`.
#      Copy the printed API key.

services:
  - type: web
    name: carbon-api
    runtime: docker
    plan: free                       # spins down after 15min inactivity
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: pnpm --filter @carbon/database migrate:apply
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: CARBON_AUTH_MODE
        value: enforced
      - key: CARBON_RATE_LIMIT_MAX
        value: 120
      - key: CARBON_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: STORAGE_ROOT
        # Ephemeral. Move to R2/S3 once you have artifacts you care about.
        value: /tmp/carbon
      - key: EMBED_WORKERS
        # Runs webhook delivery in the API process — no second service needed.
        value: 'true'
      - key: CARBON_RELEASE
        fromService:
          type: web
          name: carbon-api
          property: commit
      - key: ALLOWED_ORIGINS
        # Fill in with your Vercel URLs after deploying the frontend.
        # Example: https://carbon.vercel.app,https://dashboard.carbon.vercel.app
        sync: false
      - key: DATABASE_URL
        # Paste the pooled connection string from neon.tech.
        # Example: postgres://user:pass@ep-cool-fog-xxx.us-east-2.aws.neon.tech/carbon?sslmode=require
        sync: false
      - key: REDIS_URL
        # Paste the TLS URL from upstash.com (starts with rediss://).
        sync: false
      - key: CARBON_AI_PROVIDER
        value: openrouter
      - key: CARBON_AI_API_KEY
        # Optional. Skip if you don't want AI enrichment yet — the mechanical
        # parser still produces a full behavior graph.
        sync: false
