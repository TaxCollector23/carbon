[package]
name = "carbon-desktop"
version = "0.1.0"
description = "Carbon desktop — run stateful API replicas from a native window."
edition = "2021"

[lib]
name = "carbon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
