# Fly.io deployment for the Carbon dashboard (Next.js).
#
# Bootstrap once:  fly launch --no-deploy --copy-config --name carbon-dashboard
# Deploy:          fly deploy --config apps/dashboard/fly.toml --remote-only
#
# Requires:
#   fly secrets set DATABASE_URL=... BETTER_AUTH_SECRET=... \
#     NEXT_PUBLIC_CARBON_API_URL=https://carbon-api.fly.dev

app = "carbon-dashboard"
primary_region = "iad"

[build]
  dockerfile = "apps/dashboard/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "get"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
