name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  release:
    name: Build, sign, and publish CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # Bun resolves the workspace packages through pnpm's node_modules, so the
      # pnpm install must run before the single-executable build.
      - run: pnpm install --frozen-lockfile=false

      - name: Build standalone binaries + checksums
        run: pnpm --filter carbon-api dist:bin

      # ---- macOS signing + notarization (activates when certs are provided) --
      # Requires secrets: MACOS_CERTIFICATE_P12 (base64), MACOS_CERTIFICATE_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
      # Replace the rcodesign/notarytool commands with your signing provider if
      # you use a different one (e.g. gon). Left as a no-op gate until secrets exist.
      - name: Sign macOS binaries
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "macOS signing requires rcodesign + notarytool credentials; wire this step to your signing identity."
          # brew install mitchellh/gh/rcodesign
          # rcodesign sign --p12-file <(echo "$MACOS_CERTIFICATE_P12" | base64 -d) \
          #   --p12-password "$MACOS_CERTIFICATE_PASSWORD" apps/cli/dist/bin/carbon-darwin-arm64
          # zip each binary and `xcrun notarytool submit` + `xcrun stapler staple`
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ---- Windows Authenticode signing (activates when a cert is provided) --
      - name: Sign Windows binary
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          echo "Windows signing requires a code-signing certificate; wire this step to signtool / Azure Trusted Signing."
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/cli/dist/bin/carbon-*
            apps/cli/dist/bin/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open Homebrew formula bump PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The formula in packaging/homebrew/carbon.rb reads its version and
          # checksums from the release. This is a lightweight placeholder that
          # prints the bump instructions; replace with your tap's automation.
          echo "Bump packaging/homebrew/carbon.rb to version ${version} and update the SHA256SUMS entries."

  desktop:
    name: Build desktop app (${{ matrix.platform }})
    # Run after `release` so the desktop bundles attach to the existing release.
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            arch: arm64
          - platform: macos-x64
            os: macos-13
            arch: x64
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile=false

      - name: Prepare CLI sidecar
        shell: bash
        working-directory: apps/desktop
        run: bash scripts/prepare-sidecar.sh

      - name: Build Tauri app
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Build macOS DMG (headless)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        working-directory: apps/desktop
        run: |
          bash scripts/make-dmg.sh \
            "src-tauri/target/release/bundle/macos/Carbon Desktop.app" \
            "dist/Carbon-Desktop-0.2.0-macos-${{ matrix.arch }}.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carbon-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
            apps/desktop/dist/**/*.dmg
          if-no-files-found: error

      - name: Attach bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*
            apps/desktop/dist/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-python:
    name: Publish Python client to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/carbon-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        working-directory: clients/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]" build

      - name: Verify codegen is up to date
        working-directory: clients/python
        run: |
          .venv/bin/python scripts/codegen.py ../../apps/dashboard/lib/openapi.snapshot.json > carbon_client/generated.py
          .venv/bin/black -q carbon_client/generated.py
          git diff --exit-code -- clients/python/carbon_client/generated.py

      - name: Test
        working-directory: clients/python
        run: .venv/bin/pytest -q

      - name: Build sdist + wheel
        working-directory: clients/python
        run: .venv/bin/python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
