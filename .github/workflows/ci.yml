name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pages deploy needs an OIDC token to authenticate against
# actions/deploy-pages@v4, and write access to the pages surface. Everything
# else in this workflow is read-only, so per-job hardening is fine — but the
# top-level defaults keep the least-privilege posture explicit.
permissions:
  contents: read
  pages: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_VERSION: 24

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm turbo run typecheck

  examples:
    name: Examples typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # Typecheck only — several examples want real fixtures or network
      # (e.g. live AI providers) that CI intentionally does not provide.
      - run: pnpm examples:typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - name: Secret scan
        # Belt-to-Pino's-suspenders: even if a secret slipped past the
        # pre-commit hook (someone disabled it, someone force-pushed), CI
        # refuses to move it any further. Blocks `deploy` because that job
        # `needs: [test, ...]`.
        run: |
          pnpm --filter carbon-api build
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to scan."
          else
            node apps/cli/dist/index.cjs audit-secrets "${files[@]}"
          fi
      - name: Dashboard OpenAPI codegen drift check
        run: |
          pnpm --filter @carbon/dashboard codegen:api:from-file
          git diff --exit-code -- apps/dashboard/lib/api-types.gen.ts
        # Regenerates the typed client from the committed snapshot and fails
        # if the working copy diverges. When the API schema changes, run
        # `pnpm --filter @carbon/dashboard codegen:api:local` to refresh both
        # the snapshot and the generated types, then commit.

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm format:check

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      INTEGRATION_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Run API integration suite
        run: pnpm --filter @carbon/api test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    strategy:
      matrix:
        node: [24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARBON_E2E_PG_USER: postgres
      CARBON_E2E_PG_HOST: 127.0.0.1
      CARBON_E2E_PG_PORT: 5432
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm --filter @carbon/e2e exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: pnpm --filter @carbon/e2e test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    needs: install
    # Mintlify's CLI works unauthenticated for public preview + export, but
    # some org-scoped features (private groups, premium components) require
    # a login token. If no token is configured we still run the job — the
    # `if:` on the deploy job below is what gates publish.
    env:
      MINTLIFY_TOKEN: ${{ secrets.MINTLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Validate docs (strict)
        run: pnpm --filter @carbon/docs validate
      - name: Check for broken links
        run: pnpm --filter @carbon/docs check:links
      - name: Build static site
        run: pnpm --filter @carbon/docs build
      - name: Unpack export bundle
        # `mintlify export` produces a zip; Pages wants a directory.
        run: |
          set -euo pipefail
          cd apps/docs
          rm -rf site
          mkdir -p site
          unzip -q docs-site.zip -d site
      - name: Upload workflow artifact (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/site
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        # Only produce the pages artifact on master so PR builds don't try to
        # deploy. `actions/deploy-pages` in the next job reads this.
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CARBON_DOCS_PUBLIC == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/site

  docs-deploy:
    name: Docs deploy (GitHub Pages)
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CARBON_DOCS_PUBLIC == 'true'
    # No-op until an operator enables Pages in repo settings
    # (Settings -> Pages -> Source: GitHub Actions). Until then, the
    # deploy-pages step will fail loudly and the rest of the pipeline is
    # unaffected because this job is not a dependency of `deploy`.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [typecheck, test, format, examples, integration, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CARBON_ENABLE_FLY_DEPLOY == 'true'
    concurrency:
      group: deploy-fly-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --config apps/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy Dashboard
        run: flyctl deploy --config apps/dashboard/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
